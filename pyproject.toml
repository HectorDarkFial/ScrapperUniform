[project]
name = "uniform-scraper"
version = "0.1.0"
description = "Scraping de precios y disponibilidad de uniformes clínicos (AR/CL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.0",
    "django>=5.0.0",
    "openpyxl>=3.1.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
